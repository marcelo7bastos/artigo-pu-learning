[project]
name = "artigo-pu-learning"
version = "0.1.0"
description = "Preparacao e integracao de bases do CAF para modelagem em PU Learning."
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=6.29.0,<7",
    "jupyterlab>=4.2.0,<5",
    "matplotlib>=3.10.8",
    "numpy>=1.26.0,<3",
    "pandas>=2.2.0,<3",
    "pulearn>=0.0.12",
    "pyarrow>=15.0.0,<23",
    "scikit-learn>=1.8.0",
    "shap==0.49.1",
    "torch>=2.10.0",
    "xgboost>=3.2.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "smoke: validacoes basicas de execucao/estrutura",
    "contracts: testes de contrato de dados",
    "slow: testes de execucao completa e mais custosos",
]
